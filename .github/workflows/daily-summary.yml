name: Daily summary email

# Due from 10:30 PM to 2 AM Eastern. Fires at both possible UTC times (summer/winter) and
# slot_gate.py sends it once; GitHub often starts scheduled runs 30+ minutes late, which the
# wide window absorbs.
on:
  schedule:
    - cron: "30 3,4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional: send the summary for this Eastern date (YYYY-MM-DD), e.g. to resend a missed one"
        required: false

permissions:
  contents: write

# Shares the posting workflow's lock so the two never push at the same moment.
concurrency:
  group: autowittenberg-data
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Is it time?
        id: gate
        run: python3 slot_gate.py summary

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Send the summary
        if: steps.gate.outputs.run == 'true'
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUMMARY_RECIPIENT: ${{ secrets.SUMMARY_RECIPIENT }}
          TOKEN_VAULT_KEY: ${{ secrets.TOKEN_VAULT_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          SUMMARY_DATE: ${{ steps.gate.outputs.summary_date }}
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python send_summary.py --date "$SUMMARY_DATE" --record-sent
          else
            python send_summary.py ${MANUAL_DATE:+--date "$MANUAL_DATE"}
          fi

      - name: Remember it was sent
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          git config user.name "AutoWittenberg bot"
          git config user.email "autowittenberg-bot@users.noreply.github.com"
          git add data/summary_sent.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Summary sent for ${{ steps.gate.outputs.summary_date }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
